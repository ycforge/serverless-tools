{
  "openapi": "3.0.0",
  "info": {
    "title": "Reference API Gateway",
    "version": "1.0.0",
    "description": "Composed entry point over the user_service and analytics reference APIs."
  },
  "paths": {
    "/analytics": {
      "get": {
        "summary": "Analytics health (analytics container API)",
        "responses": {
          "200": {
            "description": "ok"
          }
        },
        "x-yc-apigateway-integration": {
          "type": "serverless_containers",
          "container_id": "${yandex_serverless_container_analytics_id}",
          "service_account_id": "ajefi3b58tak71g3ecp1"
        }
      }
    },
    "/analytics/kms": {
      "get": {
        "summary": "KMS SA-access probe (analytics container)",
        "responses": {
          "200": {
            "description": "ok"
          }
        },
        "x-yc-apigateway-integration": {
          "type": "serverless_containers",
          "container_id": "${yandex_serverless_container_analytics_id}",
          "service_account_id": "ajefi3b58tak71g3ecp1"
        }
      }
    },
    "/users": {
      "get": {
        "summary": "List users (user_service API)",
        "responses": {
          "200": {
            "description": "ok"
          }
        },
        "x-yc-apigateway-integration": {
          "type": "cloud_functions",
          "function_id": "${yandex_function_user_service_id}",
          "service_account_id": "ajefi3b58tak71g3ecp1"
        }
      }
    },
    "/users/logs": {
      "get": {
        "summary": "Emit NestJS logs at a chosen level (manual probe)",
        "parameters": [
          {
            "name": "level",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "verbose",
                "debug",
                "log",
                "info",
                "warn",
                "error",
                "fatal",
                "all"
              ],
              "default": "log"
            }
          },
          {
            "name": "message",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "count",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "context",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "ok"
          }
        },
        "x-yc-apigateway-integration": {
          "type": "cloud_functions",
          "function_id": "${yandex_function_user_service_id}",
          "service_account_id": "ajefi3b58tak71g3ecp1"
        }
      }
    }
  },
  "components": {
    "securitySchemes": {}
  }
}