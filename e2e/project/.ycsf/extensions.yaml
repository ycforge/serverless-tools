version: 1
extensions:
  - target: functions.e2e_api
    patch:
      memory: 256
      execution_timeout: 10
      service_account_id: "${var.service_account_id}"
      # Single nested block (object form, like the generated `content` block).
      # No min_level: user stdout is UNSPECIFIED and must not be filtered out.
      log_options:
        log_group_id: "${yandex_logging_group.e2e.id}"
      environment:
        E2E_EXTENSION_MARKER: api-patched
  - target: functions.e2e_authorizer
    patch:
      service_account_id: "${var.service_account_id}"
  - target: functions.e2e_worker
    patch:
      service_account_id: "${var.service_account_id}"
  - target: functions.e2e_worker_dlq
    patch:
      service_account_id: "${var.service_account_id}"
      environment:
        # The DLQ sender publishes with AWS SigV4 static keys; the queue URL is
        # `yandex_message_queue.<name>.id` (the provider reports the SQS URL).
        DLQ_QUEUE_ID: "${yandex_message_queue.e2e_worker_app_dlq.id}"
        YC_MQ_KEY_ID: "${var.mq_access_key}"
        YC_MQ_KEY_VALUE: "${var.mq_secret_key}"
  - target: functions.e2e_rename_me
    patch:
      service_account_id: "${var.service_account_id}"
  - target: containers.e2e_container
    patch:
      service_account_id: "${var.service_account_id}"
