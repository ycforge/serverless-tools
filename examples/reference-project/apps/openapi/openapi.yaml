openapi: 3.0.0
info:
  title: Reference API Gateway
  version: 1.0.0
  description: Composed entry point over the user_service and analytics reference APIs.
paths:
  /users:
    get:
      summary: List users (user_service API)
      responses:
        "200":
          description: ok
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${resources.functions.user_service.id}
        service_account_id: ajefi3b58tak71g3ecp1
  /users/logs:
    get:
      summary: Emit NestJS logs at a chosen level (manual probe)
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [verbose, debug, log, info, warn, error, fatal, all]
            default: log
        - name: message
          in: query
          schema:
            type: string
        # The gateway materializes this default as a JSON number; the connector
        # accepts typed parameter scalars and normalizes them (spec 038).
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
        - name: context
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ok
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${resources.functions.user_service.id}
        service_account_id: ajefi3b58tak71g3ecp1
  /analytics:
    get:
      summary: Analytics health (analytics container API)
      responses:
        "200":
          description: ok
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${resources.containers.analytics.id}
        service_account_id: ajefi3b58tak71g3ecp1
  /analytics/kms:
    get:
      summary: KMS SA-access probe (analytics container)
      responses:
        "200":
          description: ok
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${resources.containers.analytics.id}
        service_account_id: ajefi3b58tak71g3ecp1