# Builder keys are artifact types (ycforge:*); materializer keys are semantic
# (yandex-*). The api-gateway builder resolves to the composer builder module;
# the committed entry is the registry import specifier, substituted during the
# monorepo build (relative to packages/pilot/dist/cli/) because pilot does not
# depend on @ycforge/composer (see README «Известные ограничения»).
version: 1
builders:
  ycforge:function: "@ycforge/builders-core/nestjs-function"
  ycforge:docker-image: "@ycforge/builders-core/docker"
  ycforge:frontend: "@ycforge/builders-core/vite"
  ycforge:api-gateway: "../../../composer/dist/builder/index.js"
materializers:
  yandex-function: "@ycforge/materializers-core/yandex-function"
  yandex-serverless-container: "@ycforge/materializers-core/yandex-serverless-container"
  yandex-storage-bucket: "@ycforge/materializers-core/yandex-storage-bucket"
  yandex-api-gateway: "@ycforge/materializers-core/yandex-api-gateway"