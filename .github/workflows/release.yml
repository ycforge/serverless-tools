name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    # write-права (GitHub Release) и id-token (npm provenance) действуют только
    # в этом job, а не на CI-gate. Секрет NPM_TOKEN — org-level.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Determine npm tag
        id: npm-tag
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      # Publishes all non-private workspace packages in topological order;
      # `workspace:*` is rewritten to concrete versions and versions already
      # present in the registry are skipped. The root package and examples/*
      # are private and therefore ignored.
      - name: Publish workspace packages
        run: >-
          pnpm -r publish
          --no-git-checks
          --access public
          --tag ${{ steps.npm-tag.outputs.tag }}
          --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ${{ steps.npm-tag.outputs.prerelease }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
