openapi: 3.0.0
info:
  title: Reference API Gateway
  version: 1.0.0
  description: Composed entry point over the user_service and analytics reference APIs.
paths:
  /users:
    get:
      summary: List users (user_service API)
      responses:
        "200":
          description: ok
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${resources.functions.user_service.id}
        service_account_id: ajefi3b58tak71g3ecp1
  /analytics:
    get:
      summary: Analytics health (analytics container API)
      responses:
        "200":
          description: ok
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${resources.containers.analytics.id}
        service_account_id: ajefi3b58tak71g3ecp1